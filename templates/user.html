{% extends "base.html" %}

{% block title %}Profil Pengguna | ZAKORA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0 text-center">
            <div class="card-body p-5">

                <div class="mb-3">
                    <h1 class="display-4">👤</h1>
                </div>

                <h2>Profil Pengguna</h2>
                <p class="text-muted">Selamat datang di ZAKORA!</p>

                <hr>

                <h4>Username: {{ username }}</h4>
                <p class="text-success">Status: Pengguna Aktif</p>

                <a href="{{ url_for('beranda') }}" class="btn btn-dark mt-3">
                    Kembali ke Beranda
                </a>

            </div>
        </div>
    </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ZAKORA - Online Shopping{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('beranda') }}">
                ZAKORA
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('beranda') }}">Beranda</a>
                <a class="nav-link" href="{{ url_for('tentang') }}">Tentang</a>
                <a class="nav-link" href="{{ url_for('produk') }}">Produk</a>
                <a class="nav-link" href="{{ url_for('kontak') }}">Kontak</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 ZAKORA. All Rights Reserved.</p>
    </footer>

</body>
</html>

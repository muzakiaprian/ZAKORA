<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin ZAKORA{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        .admin-sidebar {
            width: 250px;
            background: #212529;
            color: white;
            padding: 25px 20px;
        }

        .admin-sidebar h2 {
            margin-bottom: 35px;
            color: #ffffff;
        }

        .admin-sidebar a {
            display: block;
            color: #ced4da;
            text-decoration: none;
            padding: 13px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .admin-sidebar a:hover,
        .admin-sidebar a.active {
            background: #0d6efd;
            color: white;
        }

        .admin-main {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        .admin-header h1 {
            margin: 0;
        }

        .admin-content {
            width: 100%;
        }

        @media (max-width: 768px) {
            .admin-container {
                flex-direction: column;
            }

            .admin-sidebar {
                width: 100%;
                padding: 15px;
            }

            .admin-sidebar h2 {
                margin: 0 0 15px;
            }

            .admin-sidebar a {
                display: inline-block;
                margin-bottom: 5px;
                padding: 10px;
            }

            .admin-main {
                padding: 20px 15px;
            }

            .admin-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="admin-container">

        <aside class="admin-sidebar">
            <h2>ZAKORA Admin</h2>

            <a href="{{ url_for('admin_dashboard') }}"
               class="{% if request.endpoint == 'admin_dashboard' %}active{% endif %}">
                Dashboard
            </a>

            <a href="{{ url_for('admin_produk') }}"
               class="{% if request.endpoint == 'admin_produk' %}active{% endif %}">
                Kelola Produk
            </a>

            <a href="{{ url_for('beranda') }}">
                Kembali ke Website
            </a>
        </aside>

        <main class="admin-main">

            <header class="admin-header">
                <h1>{% block page_heading %}Dashboard{% endblock %}</h1>

                <div>
                    {{ admin.nama if admin is defined else "Administrator" }}
                </div>
            </header>

            <section class="admin-content">
                {% block content %}{% endblock %}
            </section>

        </main>

    </div>

</body>
</html>
